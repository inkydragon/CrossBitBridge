name: C++ ncalrpc MWE
on:
  push:
    paths:
      - 'bridges/cpp-ncalrpc/**'
      - 'legacy/cpp_legacy/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'bridges/cpp-ncalrpc/**'
      - 'legacy/cpp_legacy/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: bridges/cpp-ncalrpc
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build independent x86 legacy DLL
        shell: pwsh
        run: ../../legacy/cpp_legacy/build.ps1
      - name: Generate and build x86 host and x64 client
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: julia-actions/setup-julia@v3.0.3
        with:
          version: '1'
          arch: x64
      - name: Exercise real cross-bitness RPC
        shell: pwsh
        run: ./scripts/test.ps1 -LegacyDll ../../legacy/cpp_legacy/build/Win32/Release/sample_legacy.dll -Julia julia
      - name: Upload binaries, generated stubs and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cpp-ncalrpc-windows
          retention-days: 7
          path: |
            legacy/cpp_legacy/build/Win32/Release/*.dll
            bridges/cpp-ncalrpc/build/Win32/Release/*.exe
            bridges/cpp-ncalrpc/build/Win32/Release/*.dll
            bridges/cpp-ncalrpc/build/x64/Release/*.exe
            bridges/cpp-ncalrpc/build/x64/Release/*.dll
            bridges/cpp-ncalrpc/build/Win32/generated/
            bridges/cpp-ncalrpc/build/x64/generated/
            bridges/cpp-ncalrpc/artifacts/logs/
